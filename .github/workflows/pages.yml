name: Deploy static demo to GitHub Pages

# Module 10.5 / ADR 0005: builds the static-export variant of
# apps/web (STATIC_DEMO=true) and deploys it to GitHub Pages. This is
# a second, independent deploy target -- it does not touch release.yml
# (Module 10.4's live-backend Render deploy) or anything it deploys.
#
# Gated the same way release.yml gates its own deploy: workflow_run on
# CI completing successfully on main, not push -- "tests must pass" is
# a required gate in front of every deploy this repo has, not just the
# live-backend one.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Manual re-deploy without needing a new commit -- e.g. after
  # editing this workflow file itself, which workflow_run's own commit
  # wouldn't otherwise trigger a Pages deploy for.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy in flight at a time; a newer commit's deploy
# should win over an older one still running, not queue behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (exact commit CI just passed)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        # apps/web imports @questlearn/design-system from its built
        # dist/, not its src/ -- see the Select/Tag disabled-prop fix
        # that made this a hard requirement, not just a nice-to-have.
        run: pnpm --filter @questlearn/config build && pnpm --filter @questlearn/design-system build

      - name: Build static demo
        run: pnpm --filter @questlearn/web exec next build
        env:
          STATIC_DEMO: "true"
          NEXT_PUBLIC_STATIC_DEMO: "true"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
