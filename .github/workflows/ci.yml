name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: questlearn
          POSTGRES_PASSWORD: questlearn
          POSTGRES_DB: questlearn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U questlearn -d questlearn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://questlearn:questlearn@localhost:5432/questlearn
      REDIS_URL: redis://localhost:6379
      CSRF_SECRET: ci-csrf-secret-placeholder-value
      JWT_SECRET: ci-jwt-secret-placeholder-value
      # See .env.example: raised in Module 7, re-verified empirically
      # against this audit-fix pass's added Playwright test and still
      # holds at 40.
      AUTH_THROTTLE_LIMIT: 40
      AUTH_THROTTLE_TTL_MS: 60000
      # See .env.example: the actual bottleneck this audit-fix pass hit
      # was the app-wide default (covers /auth/refresh and every plain
      # GET read), not AUTH_THROTTLE_LIMIT.
      GLOBAL_THROTTLE_LIMIT: 300
      GLOBAL_THROTTLE_TTL_MS: 60000
      API_URL: http://localhost:4000
      WEB_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @questlearn/config build && pnpm --filter @questlearn/design-system build

      - name: Generate Prisma client
        run: pnpm --filter @questlearn/api prisma:generate

      - name: Lint
        run: pnpm -r lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Apply Prisma migrations
        run: pnpm --filter @questlearn/api exec prisma migrate deploy

      - name: Seed database
        # The Playwright class journey logs in as the seeded demo
        # teacher (apps/web/e2e/classes.spec.ts) — without this, that
        # login fails with invalid credentials in a fresh CI database.
        run: pnpm --filter @questlearn/api seed

      - name: Unit and integration tests
        run: pnpm -r test

      - name: Build
        run: pnpm -r build

      - name: Install Playwright browsers
        run: pnpm --filter @questlearn/web exec playwright install --with-deps chromium

      - name: Start API
        # Redirected to apps/api/dev.log, not just the job log — the
        # Playwright auth flow reads verification/reset tokens back
        # out of that file (see apps/web/e2e/support/api-log.ts),
        # since no real email provider is wired up in this module.
        run: nohup pnpm --filter @questlearn/api start > apps/api/dev.log 2>&1 &
        env:
          PORT: 4000

      - name: Start web
        run: nohup pnpm --filter @questlearn/web start > apps/web/web.log 2>&1 &
        env:
          PORT: 3000

      - name: Wait for API and web
        run: |
          npx wait-on http://localhost:4000/health http://localhost:3000/ --timeout 60000

      - name: Warm up dynamic routes
        # Found via a real CI investigation (Module 10.5's PR #20): every
        # test that creates a resource and then loads ITS OWN dynamic
        # detail page (/classes/[id], /activities/[id], /questions/[id],
        # /quests/[id], etc.) deterministically timed out against a real
        # GitHub-hosted runner three separate times, at the exact same
        # 5s/30s boundaries, with byte-for-byte identical timing across
        # runs -- while an exhaustive from-scratch reproduction (a real
        # Ubuntu container, same Node version, same fresh build, same
        # fresh seeded DB, even capped to the runner's own 2 vCPU/7GB)
        # could not reproduce it even once. The static/list pages (which
        # never hit this) and the DB itself (309 Jest tests against the
        # same Postgres, seconds earlier, all fast) were both proven
        # healthy, narrowing this to something about the FIRST render of
        # each dynamic route specifically on that infrastructure -- most
        # plausibly the on-demand fallback render (dynamicParams:true;
        # every one of these routes' generateStaticParams legitimately
        # returns [] outside the static-demo build) compiling and
        # rendering for the first time exactly when a tight 5s/30s
        # Playwright timeout is also running, on a runner whose
        # characteristics an isolated container test doesn't reproduce.
        # A bogus id still exercises the exact same route module load +
        # compile + fallback-render path a real id would (it just 404s
        # instead of finding data) -- so hitting each route once here
        # pays that first-render cost outside any test's own budget.
        # `|| true` throughout: a 404/error response is the expected,
        # fine outcome: the request itself, not its result, is the point.
        run: |
          for path in \
            /activities/warmup \
            /activities/warmup/assign \
            /activities/warmup/preview \
            /activities/warmup/report \
            /assignments/warmup/attempt \
            /attempts/warmup/result \
            /classes/warmup \
            /classes/warmup/learners/warmup/report \
            /classes/warmup/mastery \
            /classes/warmup/report \
            /questions/warmup \
            /questions/warmup/edit \
            /quests/warmup \
          ; do
            curl -s -o /dev/null "http://localhost:3000${path}" || true
          done

      - name: Playwright auth flow
        run: pnpm --filter @questlearn/web exec playwright test
        env:
          WEB_URL: http://localhost:3000

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots/

      # Temporary diagnostic upload for the CI anomaly under
      # investigation on PR #20 (see TESTING_REPORT.md's Module 10.5
      # section) -- server logs and Playwright's own traces/network
      # capture aren't visible in the plain job log at all, and the
      # warm-up step (above) didn't change the failure, which rules
      # out compile/first-render cost and points at something in the
      # actual request/response for a freshly created resource. To be
      # removed once the real mechanism is found and fixed.
      - name: Upload diagnostic logs and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-anomaly-diagnostics
          path: |
            apps/api/dev.log
            apps/web/web.log
            apps/web/test-results/
